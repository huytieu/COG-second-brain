name: Apply updater validator failure fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/updater-validator-failure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/updater-validator-failure

      - name: Apply guarded updater validation edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text(encoding='utf-8')

          test_marker = '  "tests/test-cog-update-trust-boundaries.sh"\n'
          test_line = '  "tests/test-cog-update-validator-failure.sh"\n'
          if test_line not in text:
              if text.count(test_marker) != 1:
                  raise SystemExit('validator regression marker not found exactly once')
              text = text.replace(test_marker, test_marker + test_line, 1)

          force_old = '''    rebuild_agent_plugin
              run_validator || true
              exit 0'''.replace('              ', '')
          force_new = '''    rebuild_agent_plugin
              if ! run_validator; then
                err "Update applied, but packaging validation failed. Review the working tree before committing."
                return 1
              fi
              exit 0'''.replace('              ', '')
          if force_new not in text:
              if text.count(force_old) != 1:
                  raise SystemExit('force validator block not found exactly once')
              text = text.replace(force_old, force_new, 1)

          interactive_old = '''    rebuild_agent_plugin
              run_validator || true
              info "Review changes with ${BOLD}git diff${RESET}, then commit when ready:"'''.replace('              ', '')
          interactive_new = '''    rebuild_agent_plugin
              if ! run_validator; then
                err "Update applied, but packaging validation failed. Review the working tree before committing."
                return 1
              fi
              info "Review changes with ${BOLD}git diff${RESET}, then commit when ready:"'''.replace('              ', '')
          if interactive_new not in text:
              if text.count(interactive_old) != 1:
                  raise SystemExit('interactive validator block not found exactly once')
              text = text.replace(interactive_old, interactive_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updater code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: propagate updater validation failures"
            git push origin HEAD:fix/updater-validator-failure
          fi
