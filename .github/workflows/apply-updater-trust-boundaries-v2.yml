name: Apply updater trust boundaries v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/updater-trust-boundaries-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/updater-trust-boundaries-v2

      - name: Correct updater help text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text(encoding='utf-8')

          bad = '\n  COG_UPSTREAM_URL=<url> ./cog-update.sh --force   Explicitly trust a different upstream URL\n\nset -euo pipefail\n'
          good = '\n#   COG_UPSTREAM_URL=<url> ./cog-update.sh --force   Explicitly trust a different upstream URL\n\nset -euo pipefail\n'
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              marker = '#   ./cog-update.sh --help     Show this help message\n'
              if text.count(marker) != 1:
                  raise SystemExit('header help marker not found exactly once')
              text = text.replace(marker, marker + '#   COG_UPSTREAM_URL=<url> ./cog-update.sh --force   Explicitly trust a different upstream URL\n', 1)

          runtime_marker = '  ./cog-update.sh --help     Show this help message\n\nHow it works:'
          runtime_replacement = '  ./cog-update.sh --help     Show this help message\n  COG_UPSTREAM_URL=<url> ./cog-update.sh --force   Explicitly trust a different upstream URL\n\nHow it works:'
          if runtime_replacement not in text:
              if text.count(runtime_marker) != 1:
                  raise SystemExit('runtime help marker not found exactly once')
              text = text.replace(runtime_marker, runtime_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updater code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: correct updater trust help text"
            git push origin HEAD:fix/updater-trust-boundaries-v2
          fi
