name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: fix/updater-self-refresh

      - name: Run agent-surface regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Check Cursor agent parity
        run: bash tests/test-cursor-agent-parity.sh

      - name: Test lane classifier hard gates
        run: bash tests/test-lane-classify.sh

      - name: Test checkpoint evidence integrity
        run: bash tests/test-checkpoint.sh

      - name: Check closed-loop harness assets
        run: bash tests/test-harness-assets.sh

      - name: Test harness bootstrap contract
        run: bash tests/test-harness-bootstrap-contract.sh

      - name: Test safe harness report rendering
        run: python3 tests/test-harness-report-renderer.py

      - name: Detect updater mode drift
        run: bash tests/test-cog-update-mode-drift.sh

      - name: Test updater path safety
        run: bash tests/test-cog-update-path-safety.sh

      - name: Test updater trust boundaries
        run: bash tests/test-cog-update-trust-boundaries.sh

      - name: Test updater validator failure propagation
        run: bash tests/test-cog-update-validator-failure.sh

      - name: Test updater self refresh
        run: bash tests/test-cog-update-self-refresh.sh

      - name: Preserve updater executable modes
        run: bash tests/test-cog-update-file-mode.sh

      - name: Exercise force-mode multi-file updates
        run: bash tests/test-cog-update-force.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh

      - name: Normalize updater self-refresh indentation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/updater-self-refresh' && github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    if [[ $self_updated -eq 1 ]]; then
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
''',
                  '''    if [[ $self_updated -eq 1 ]]; then
      if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
        err "Updater changed again after its one allowed restart; refusing a restart loop."
        return 1
      fi
      info "Updater changed; restarting once to load the new framework file list..."
      export COG_UPDATE_REEXEC=1
      exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
    fi
''',
              ),
              (
                  '''  if [[ $self_updated -eq 1 ]]; then
  if [[ $skipped -gt 0 ]]; then
    err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
    return 1
  fi
  if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
    err "Updater changed again after its one allowed restart; refusing a restart loop."
    return 1
  fi
  info "Updater changed; restarting once to load the new framework file list..."
  export COG_UPDATE_REEXEC=1
  exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
fi
''',
                  '''  if [[ $self_updated -eq 1 ]]; then
    if [[ $skipped -gt 0 ]]; then
      err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
      return 1
    fi
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
''',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('unexpected self-refresh block formatting')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize updater self-refresh blocks"
            git push origin HEAD:fix/updater-self-refresh
          fi
