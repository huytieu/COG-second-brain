name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: fix/updater-plugin-rebuild-failure

      - name: Run agent-surface regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Check Cursor agent parity
        run: bash tests/test-cursor-agent-parity.sh

      - name: Test lane classifier hard gates
        run: bash tests/test-lane-classify.sh

      - name: Test checkpoint evidence integrity
        run: bash tests/test-checkpoint.sh

      - name: Check closed-loop harness assets
        run: bash tests/test-harness-assets.sh

      - name: Test harness bootstrap contract
        run: bash tests/test-harness-bootstrap-contract.sh

      - name: Test safe harness report rendering
        run: python3 tests/test-harness-report-renderer.py

      - name: Detect updater mode drift
        run: bash tests/test-cog-update-mode-drift.sh

      - name: Test updater path safety
        run: bash tests/test-cog-update-path-safety.sh

      - name: Test updater trust boundaries
        run: bash tests/test-cog-update-trust-boundaries.sh

      - name: Test updater validator failure propagation
        run: bash tests/test-cog-update-validator-failure.sh

      - name: Test updater self refresh
        run: bash tests/test-cog-update-self-refresh.sh

      - name: Preserve updater executable modes
        run: bash tests/test-cog-update-file-mode.sh

      - name: Exercise force-mode multi-file updates
        run: bash tests/test-cog-update-force.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh

      - name: Apply updater plugin rebuild failure fix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/updater-plugin-rebuild-failure' && github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text(encoding='utf-8')

          test_marker = '  "tests/test-cog-update-validator-failure.sh"\n'
          test_line = '  "tests/test-cog-update-plugin-rebuild-failure.sh"\n'
          if test_line not in text:
              if text.count(test_marker) != 1:
                  raise SystemExit('plugin rebuild regression marker not found exactly once')
              text = text.replace(test_marker, test_marker + test_line, 1)

          old_rebuild = '''rebuild_agent_plugin() {
            if [[ -x "scripts/build-agent-plugin.sh" ]]; then
              ./scripts/build-agent-plugin.sh || warn "Agent plugin mirror rebuild failed; run ./scripts/build-agent-plugin.sh manually"
            fi
          }'''.replace('            ', '')
          new_rebuild = '''rebuild_agent_plugin() {
            if [[ -x "scripts/build-agent-plugin.sh" ]]; then
              if ! ./scripts/build-agent-plugin.sh; then
                warn "Agent plugin mirror rebuild failed; run ./scripts/build-agent-plugin.sh manually"
                return 1
              fi
            fi
            return 0
          }'''.replace('            ', '')
          if new_rebuild not in text:
              if text.count(old_rebuild) != 1:
                  raise SystemExit('rebuild_agent_plugin block not found exactly once')
              text = text.replace(old_rebuild, new_rebuild, 1)

          old_force = '''    info "Backups saved as *.backup-YYYYMMDD-HHMMSS alongside originals"
            rebuild_agent_plugin
            if ! run_validator; then'''.replace('            ', '')
          new_force = '''    info "Backups saved as *.backup-YYYYMMDD-HHMMSS alongside originals"
            if ! rebuild_agent_plugin; then
              err "Update applied, but Agent Plugins mirror rebuild failed. Review the working tree before committing."
              return 1
            fi
            if ! run_validator; then'''.replace('            ', '')
          if new_force not in text:
              if text.count(old_force) != 1:
                  raise SystemExit('force rebuild call marker not found exactly once')
              text = text.replace(old_force, new_force, 1)

          old_interactive = '''  if [[ $updated -gt 0 ]]; then
            rebuild_agent_plugin
            if ! run_validator; then'''.replace('            ', '')
          new_interactive = '''  if [[ $updated -gt 0 ]]; then
            if ! rebuild_agent_plugin; then
              err "Update applied, but Agent Plugins mirror rebuild failed. Review the working tree before committing."
              return 1
            fi
            if ! run_validator; then'''.replace('            ', '')
          if new_interactive not in text:
              if text.count(old_interactive) != 1:
                  raise SystemExit('interactive rebuild call marker not found exactly once')
              text = text.replace(old_interactive, new_interactive, 1)

          force_bad = '''    if [[ $self_updated -eq 1 ]]; then
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
'''
          force_good = '''    if [[ $self_updated -eq 1 ]]; then
      if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
        err "Updater changed again after its one allowed restart; refusing a restart loop."
        return 1
      fi
      info "Updater changed; restarting once to load the new framework file list..."
      export COG_UPDATE_REEXEC=1
      exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
    fi
'''
          if force_bad in text:
              text = text.replace(force_bad, force_good, 1)
          elif force_good not in text:
              raise SystemExit('unexpected force self-refresh formatting')

          interactive_bad = '''  if [[ $self_updated -eq 1 ]]; then
  if [[ $skipped -gt 0 ]]; then
    err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
    return 1
  fi
  if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
    err "Updater changed again after its one allowed restart; refusing a restart loop."
    return 1
  fi
  info "Updater changed; restarting once to load the new framework file list..."
  export COG_UPDATE_REEXEC=1
  exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
fi
'''
          interactive_good = '''  if [[ $self_updated -eq 1 ]]; then
    if [[ $skipped -gt 0 ]]; then
      err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
      return 1
    fi
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
'''
          if interactive_bad in text:
              text = text.replace(interactive_bad, interactive_good, 1)
          elif interactive_good not in text:
              raise SystemExit('unexpected interactive self-refresh formatting')

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: propagate plugin mirror rebuild failures"
            git push origin HEAD:fix/updater-plugin-rebuild-failure
          fi
