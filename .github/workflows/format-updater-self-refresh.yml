name: Format updater self refresh blocks

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/updater-self-refresh' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/updater-self-refresh

      - name: Normalize restart indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    if [[ $self_updated -eq 1 ]]; then
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
''',
                  '''    if [[ $self_updated -eq 1 ]]; then
      if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
        err "Updater changed again after its one allowed restart; refusing a restart loop."
        return 1
      fi
      info "Updater changed; restarting once to load the new framework file list..."
      export COG_UPDATE_REEXEC=1
      exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
    fi
''',
              ),
              (
                  '''  if [[ $self_updated -eq 1 ]]; then
  if [[ $skipped -gt 0 ]]; then
    err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
    return 1
  fi
  if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
    err "Updater changed again after its one allowed restart; refusing a restart loop."
    return 1
  fi
  info "Updater changed; restarting once to load the new framework file list..."
  export COG_UPDATE_REEXEC=1
  exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
fi
''',
                  '''  if [[ $self_updated -eq 1 ]]; then
    if [[ $skipped -gt 0 ]]; then
      err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
      return 1
    fi
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
''',
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit('restart block is neither expected old nor formatted form')

          if changed:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize updater self-refresh blocks"
            git push origin HEAD:fix/updater-self-refresh
          fi
