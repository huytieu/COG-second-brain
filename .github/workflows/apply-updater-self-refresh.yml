name: Normalize updater self refresh formatting

on:
  push:
    branches:
      - fix/updater-self-refresh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/updater-self-refresh

      - name: Normalize self-refresh block formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text(encoding='utf-8')

          force_bad = '''    if [[ $self_updated -eq 1 ]]; then
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
'''
          force_good = '''    if [[ $self_updated -eq 1 ]]; then
      if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
        err "Updater changed again after its one allowed restart; refusing a restart loop."
        return 1
      fi
      info "Updater changed; restarting once to load the new framework file list..."
      export COG_UPDATE_REEXEC=1
      exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
    fi
'''
          if force_bad in text:
              text = text.replace(force_bad, force_good, 1)
          elif force_good not in text:
              raise SystemExit('force self-refresh block is neither expected old nor formatted form')

          interactive_bad = '''  if [[ $self_updated -eq 1 ]]; then
  if [[ $skipped -gt 0 ]]; then
    err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
    return 1
  fi
  if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
    err "Updater changed again after its one allowed restart; refusing a restart loop."
    return 1
  fi
  info "Updater changed; restarting once to load the new framework file list..."
  export COG_UPDATE_REEXEC=1
  exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
fi
'''
          interactive_good = '''  if [[ $self_updated -eq 1 ]]; then
    if [[ $skipped -gt 0 ]]; then
      err "Updater changed while some framework files were skipped. Run cog-update.sh again to load the new framework file list without replaying skipped choices."
      return 1
    fi
    if [[ "${COG_UPDATE_REEXEC:-0}" == "1" ]]; then
      err "Updater changed again after its one allowed restart; refusing a restart loop."
      return 1
    fi
    info "Updater changed; restarting once to load the new framework file list..."
    export COG_UPDATE_REEXEC=1
    exec bash "$REPO_ROOT/cog-update.sh" "${original_args[@]}"
  fi
'''
          if interactive_bad in text:
              text = text.replace(interactive_bad, interactive_good, 1)
          elif interactive_good not in text:
              raise SystemExit('interactive self-refresh block is neither expected old nor formatted form')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updater code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize updater self-refresh blocks"
            git push origin HEAD:fix/updater-self-refresh
          fi
